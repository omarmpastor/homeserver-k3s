apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.bazarr.appName }}-deployment

spec:
  replicas: {{ .Values.bazarr.replicaCount }}

  selector:
    matchLabels:
      app: {{ .Values.bazarr.appName }}
  
  template:
    metadata:
      labels:
        app: {{ .Values.bazarr.appName }}
    
    spec:
      securityContext:
        fsGroup: 1000
    
      containers:
        - name: {{ .Values.bazarr.appName }}
          image: {{ printf "%s:%s" .Values.bazarr.image.repository .Values.bazarr.image.tag | quote }}
          imagePullPolicy: {{ .Values.bazarr.image.pullPolicy }}

          env:
            - name: PUID
              value: "1000"
            
            - name: PGID
              value: "1000"
            
            - name: TZ
              value: Europe/Madrid
          
          ports:
            - name: {{ .Values.bazarr.service.portHttpName }}
              containerPort: {{ .Values.bazarr.service.targetPort }}
          
          volumeMounts:
            - name: config
              mountPath: {{ .Values.bazarr.storage.mountPathConfig }}

            - name: movies
              mountPath: /storage/movies

            - name: tvshows
              mountPath: /storage/TV
      
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ .Values.bazarr.appName }}-pvc-config

        - name: movies
          hostPath:
            path: {{ printf "%s/%s" .Values.localStoragePath "media/movies" | quote }}
            type: Directory

        - name: tvshows
          hostPath:
            path: {{ printf "%s/%s" .Values.localStoragePath "media/tv" | quote }}
            type: Directory
