replicaCount: 1

image:
  repository: "docker.io/library/nextcloud"
  pullPolicy: IfNotPresent
  tag: "stable-apache"

service:
  type: ClusterIP
  port: 80
  targetPort: 80
  portHttpName: http

httpRoute:
  parentRefs:
    - name: cluster-gateway
      namespace: kube-system
  
  domain: "omp.home"

pvc:
  storageSize: 1Gi

storage:
  mountPathConfig: image_path_config
  localStoragePath: "/mnt/storage"

configService:
  user: user
  password: password
  ip: 192.168.1.100
